<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6f5e">
<title>가족 여행 플래너</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="css/styles.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="여행 플래너">
</head>
<body>
<header class="top">
  <div class="top-row">
    <select id="tripSel" aria-label="여행 선택"></select>
    <button class="ghost" data-act="new-trip" aria-label="새 여행 만들기">＋ 새 여행</button>
  </div>
  <h1 id="tripTitle"></h1>
  <p class="sub" id="tripSub"></p>
</header>
<div id="notice" role="status" aria-live="polite"></div>
<nav class="tabs" id="tabs" role="tablist" aria-label="화면"></nav>
<main id="view"></main>
<footer class="foot">
  <p>⚠️ 운영시간·예약·공연·주차요금·좌표는 <strong>실시간 확인 결과가 아닌 참고 정보</strong>입니다. 방문 전 공식 채널에서 확인하세요. 이동·체류시간은 계획용 예상치입니다.</p>
  <p>데이터는 이 브라우저에만 저장되며 다른 기기로 자동 동기화되지 않습니다. 「설정」에서 백업 파일을 내보낼 수 있어요.</p>
</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" defer></script>
<script src="js/engine.js" defer></script>
<script src="js/registry.js" defer></script>
<script src="js/trips/jeonju.js" defer></script>
<script src="js/storage.js" defer></script>
<script src="js/app.js" defer></script>
<script>if("serviceWorker"in navigator&&location.protocol!=="file:")addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})</script>
</body>
</html>
